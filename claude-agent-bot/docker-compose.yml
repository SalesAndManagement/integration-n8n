services:
  claude-agent-bot:
    build: .
    container_name: claude-agent-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Усередині контейнера шляхи фіксовані — перекриваємо те, що стоїть у .env.
      AGENT_WORKSPACE: /data/workspace
      STATE_FILE: /data/sessions.json
      CLAUDE_CONFIG_DIR: /data/claude
      BROWSER_PROFILE_DIR: /data/browser-profile
      BROWSER_MCP_COMMAND: playwright-mcp
    volumes:
      # Уся папка агента лежить на хості поруч із цим файлом — її видно й можна бекапити.
      - ./data:/data
      # Дати агенту читати колекцію workflow'ів цього репозиторію (тільки читання):
      # - ../workflows:/data/workspace/workflows:ro
    # chromium падає на дефолтних 64МБ /dev/shm
    shm_size: "1gb"
    # Без init у контейнері накопичуються зомбі-процеси браузера
    init: true
    networks: [agent-net]

  # Піднімається лише з профілем: docker compose --profile n8n up -d
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    profiles: [n8n]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      GENERIC_TIMEZONE: Europe/Kyiv
    volumes:
      - n8n-data:/home/node/.n8n
    networks: [agent-net]

volumes:
  n8n-data:

networks:
  agent-net:
