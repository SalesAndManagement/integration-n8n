# n8n production stack — Postgres + Redis + queue mode (workers + webhook processor)
# Caddy = automatic HTTPS, autoheal = self-healing, backup = nightly pg_dump.

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_POSTGRESDB_POOL_SIZE: ${DB_POOL_SIZE:-20}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  QUEUE_WORKER_TIMEOUT: ${QUEUE_WORKER_TIMEOUT:-300}
  GENERIC_TIMEZONE: ${TZ:-Europe/Kyiv}
  TZ: ${TZ:-Europe/Kyiv}

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
  restart: unless-stopped
  env_file: [.env]
  environment: *n8n-env
  volumes:
    - n8n_data:/home/node/.n8n
    - ./files:/files
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  labels:
    autoheal: "true"
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  healthcheck:
    test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 90s
  logging: *logging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Kyiv}
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-6GB}
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=8
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - jit=off
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      autoheal: "true"
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy noeviction
      --save ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      autoheal: "true"
    logging: *logging

  # main instance: UI, REST API, schedule/poll triggers
  n8n:
    <<: *n8n-common
    environment:
      <<: *n8n-env
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"

  # workers: run the executions
  n8n-worker:
    <<: *n8n-common
    command: worker --concurrency=${WORKER_CONCURRENCY:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # dedicated webhook processor(s)
  n8n-webhook:
    <<: *n8n-common
    command: webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy
    deploy:
      replicas: ${WEBHOOK_REPLICAS:-1}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      MAX_BODY: ${N8N_PAYLOAD_SIZE_MAX:-256}MB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
    labels:
      autoheal: "true"
    logging: *logging

  # self-healing: restarts any container whose healthcheck reports unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 120
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging

  # nightly pg_dump into ./backups, keeps BACKUP_KEEP_DAYS days
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Kyiv}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s); target=$$(date -d 'tomorrow 03:30' +%s 2>/dev/null || echo $$((now+86400)));
          sleep $$((target-now));
          f=/backups/n8n-$$(date +%Y%m%d-%H%M%S).sql.gz;
          if pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" | gzip > "$$f"; then
            echo "backup ok: $$f";
          else
            echo "backup FAILED"; rm -f "$$f";
          fi;
          find /backups -name 'n8n-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete;
        done
    logging: *logging

volumes:
  pg_data:
  redis_data:
  n8n_data:
  caddy_data:
  caddy_config:
